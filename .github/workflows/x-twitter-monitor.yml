name: X monitor

on:
  schedule:
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-twitter-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Search X
        env:
          TWTAPI_API_KEY: ${{ secrets.TWTAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          API_KEY = os.environ["TWTAPI_API_KEY"]
          TELEGRAM_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          STATE_FILE = Path("x_search_seen.json")

          queries = {
              "pair": (
                  '("Seeun Yujun" OR "Yujun Seeun" '
                  'OR "세은 유준" OR "유준 세은" '
                  'OR "Сэын Юджун" OR "Юджун Сэын" '
                  'OR "SeeJun")'
              ),

              "xikers": (
                  '("xikers" OR "싸이커스") '
                  '(comeback OR album OR release OR concert OR tour '
                  'OR festival OR performance OR award OR interview '
                  'OR magazine OR "music show" '
                  'OR 컴백 OR 앨범 OR 발매 OR 콘서트 OR 투어 '
                  'OR 페스티벌 OR 공연 OR 시상식 OR 인터뷰 OR 잡지)'
              ),

              "seeun_fromm": (
                  '("Seeun" OR "세은" OR "Сэын") '
                  '(Fromm OR "프롬")'
              ),

              "yujun_fromm": (
                  '("Yujun" OR "유준" OR "Юджун") '
                  '(Fromm OR "프롬")'
              ),
          }

          now = datetime.now(timezone.utc)
          hour = now.hour

          category_by_hour = {
              0: "pair",
              3: "xikers",
              6: "seeun_fromm",
              9: "yujun_fromm",
              12: "pair",
              15: "xikers",
              18: "seeun_fromm",
              21: "yujun_fromm",
          }

          category = category_by_hour.get(hour)

          if category is None:
              print(f"No category assigned for UTC hour {hour}.")
              raise SystemExit(0)

          query = queries[category]

          print(f"UTC hour: {hour}")
          print(f"Category: {category}")
          print(f"Query: {query}")

          API_URL = "https://api.twtapi.com/api/v1/twitter/Search"

          params = urllib.parse.urlencode({
              "q": query,
              "type": "Latest",
              "count": "20",
          })

          request = urllib.request.Request(
              f"{API_URL}?{params}",
              headers={
                  "X-API-Key": API_KEY,
                  "Accept": "application/json",
              },
              method="GET",
          )

          print("Searching X...")

          with urllib.request.urlopen(
              request,
              timeout=60
          ) as response:
              payload = json.loads(
                  response.read().decode("utf-8")
              )

          normalized = payload.get("_normalized", {})
          tweets = normalized.get("tweets", [])

          print(f"Received {len(tweets)} tweets.")

          if not STATE_FILE.exists():
              STATE_FILE.write_text(
                  json.dumps(
                      {
                          "pair": [],
                          "xikers": [],
                          "seeun_fromm": [],
                          "yujun_fromm": []
                      },
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              print("State initialized.")
              raise SystemExit(0)

          try:
              state = json.loads(
                  STATE_FILE.read_text(encoding="utf-8")
              )
          except Exception:
              state = {
                  "pair": [],
                  "xikers": [],
                  "seeun_fromm": [],
                  "yujun_fromm": []
              }

          seen = set(state.get(category, []))

          blocked_words = [
              "wts",
              "wtb",
              "sell",
              "selling",
              "photocard",
              "photo card",
              "pob",
              "pcs",
              "포카",
              "포토카드",
              "포토 카드",
              "양도",
              "거래",
              "교환",
              "판매",
          ]

          def extract_tweet(item):
              tweet_id = str(item.get("rest_id", ""))

              result = item.get("result") or {}

              if result.get("tweet"):
                  result = result["tweet"] or {}

              legacy = result.get("legacy") or {}

              text = (
                  legacy.get("full_text")
                  or legacy.get("text")
                  or ""
              )

              user_result = (
                  result
                  .get("core", {})
                  .get("user_results", {})
                  .get("result", {})
              ) or {}

              user_core = user_result.get("core", {}) or {}

              author = user_core.get("screen_name", "")

              created_at = legacy.get("created_at", "")

              if not tweet_id or not text:
                  return None

              return {
                  "id": tweet_id,
                  "text": text,
                  "author": author,
                  "created_at": created_at,
                  "url": (
                      f"https://x.com/{author}/status/{tweet_id}"
                  ),
              }

          def is_trade(text):
              normalized = text.lower()

              for word in blocked_words:
                  if word in normalized:
                      return True, f"blocked:{word}"

              return False, ""

          def category_ok(category, text):
              normalized = text.lower()

              if category == "pair":
                  return (
                      (
                          ("seeun" in normalized or "세은" in normalized or "сэын" in normalized)
                          and
                          ("yujun" in normalized or "유준" in normalized or "юджун" in normalized)
                      )
                  )

              if category == "xikers":
                  event_words = [
                      "comeback",
                      "album",
                      "release",
                      "concert",
                      "tour",
                      "festival",
                      "performance",
                      "award",
                      "interview",
                      "magazine",
                      "music show",
                      "컴백",
                      "앨범",
                      "발매",
                      "콘서트",
                      "투어",
                      "페스티벌",
                      "공연",
                      "시상식",
                      "인터뷰",
                      "잡지",
                  ]

                  return (
                      ("xikers" in normalized or "싸이커스" in normalized)
                      and any(word in normalized for word in event_words)
                  )

              if category == "seeun_fromm":
                  return (
                      ("seeun" in normalized or "세은" in normalized or "сэын" in normalized)
                      and
                      ("fromm" in normalized or "프롬" in normalized)
                  )

              if category == "yujun_fromm":
                  return (
                      ("yujun" in normalized or "유준" in normalized or "юджун" in normalized)
                      and
                      ("fromm" in normalized or "프롬" in normalized)
                  )

              return False

          new_tweets = []

          for item in tweets:
              tweet = extract_tweet(item)

              if tweet is None:
                  continue

              if tweet["id"] in seen:
                  continue

              new_tweets.append(tweet)

          print(f"New unseen tweets: {len(new_tweets)}")

          # API returns newest first.
          # Send oldest first if several new posts were found.
          new_tweets.reverse()

          updated_seen = set(seen)

          for tweet in new_tweets:
              updated_seen.add(tweet["id"])

              trade, reason = is_trade(tweet["text"])

              if trade:
                  print(
                      f"REJECT {tweet['id']}: {reason}"
                  )
                  continue

              if not category_ok(category, tweet["text"]):
                  print(
                      f"REJECT {tweet['id']}: "
                      "category filter"
                  )
                  continue

              if category == "pair":
                  label = "💞 Seeun × Yujun"
              elif category == "xikers":
                  label = "📰 Xikers"
              elif category == "seeun_fromm":
                  label = "💬 Seeun / Fromm"
              else:
                  label = "💬 Yujun / Fromm"

              message = f"{label}\n\n"
              message += tweet["text"][:3500]
              message += "\n\n"
              message += tweet["url"]

              telegram_url = (
                  f"https://api.telegram.org/bot"
                  f"{TELEGRAM_TOKEN}/sendMessage"
              )

              telegram_data = urllib.parse.urlencode({
                  "chat_id": CHAT_ID,
                  "text": message,
              }).encode("utf-8")

              telegram_request = urllib.request.Request(
                  telegram_url,
                  data=telegram_data,
                  method="POST",
              )

              with urllib.request.urlopen(
                  telegram_request,
                  timeout=30
              ) as response:
                  response.read()

              print(
                  f"SENT {tweet['id']} "
                  f"from @{tweet['author']}"
              )

          # Keep state bounded.
          state[category] = list(updated_seen)[-1000:]

          STATE_FILE.write_text(
              json.dumps(
                  state,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          PY

      - name: Save state
        run: |
          git config user.name "xikers-updates-bot"
          git config user.email "actions@users.noreply.github.com"

          git add x_search_seen.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update X search state"
          git push
