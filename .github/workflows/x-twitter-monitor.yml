name: X monitor

on:
  schedule:
    - cron: "0 0,2,5,7,10,12,15,17,20,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-twitter-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Search X
        env:
          TWTAPI_API_KEY: ${{ secrets.TWTAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          API_KEY = os.environ["TWTAPI_API_KEY"]
          TELEGRAM_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          STATE_FILE = Path("x_search_seen.json")

          # ------------------------------------------------------------
          # Decide which category this scheduled run handles.
          # GitHub cron uses UTC.
          # ------------------------------------------------------------

          current_hour = datetime.now(timezone.utc).hour

          category_by_hour = {
              0: "pair",
              2: "xikers",
              5: "seeun_fromm",
              7: "yujun_fromm",
              10: "pair",
              12: "xikers",
              15: "seeun_fromm",
              17: "yujun_fromm",
              20: "pair",
              22: "xikers",
          }

          category = category_by_hour.get(current_hour)

          if category is None:
              print(f"No category for UTC hour {current_hour}.")
              raise SystemExit(0)

          # ------------------------------------------------------------
          # Search queries.
          # Keep them separate so one noisy category cannot consume
          # the entire page of results from another category.
          # ------------------------------------------------------------

          queries = {
              "pair": (
                  '("Seeun Yujun" OR "Yujun Seeun" '
                  'OR "세은 유준" OR "유준 세은" '
                  'OR "Сэын Юджун" OR "Юджун Сэын" '
                  'OR "SeeJun" OR "Сэджуны") '
                  '-is:retweet'
              ),

              "xikers": (
                  '("xikers" OR "싸이커스") '
                  '(comeback OR album OR release OR concert OR tour '
                  'OR festival OR performance OR award OR interview '
                  'OR magazine OR appearance OR schedule OR show '
                  'OR "music show" OR 컴백 OR 앨범 OR 발매 '
                  'OR 콘서트 OR 투어 OR 페스티벌 OR 공연 '
                  'OR 시상식 OR 인터뷰 OR 잡지 OR 화보 '
                  'OR 출연 OR 일정 OR 스케줄 OR 방송 OR 음방 '
                  'OR 팬미팅) '
                  '-is:retweet'
              ),

              "seeun_fromm": (
                  '("Seeun" OR "세은" OR "Сэын") '
                  '(Fromm OR "프롬") '
                  '-is:retweet'
              ),

              "yujun_fromm": (
                  '("Yujun" OR "유준" OR "Юджун") '
                  '(Fromm OR "프롬") '
                  '-is:retweet'
              ),
          }

          query = queries[category]

          print(f"UTC hour: {current_hour}")
          print(f"Category: {category}")
          print(f"Query: {query}")

          # ------------------------------------------------------------
          # Check remaining monthly quota.
          # This endpoint does not consume a Search call.
          # ------------------------------------------------------------

          status_url = "https://api.twtapi.com/myapi/status"

          status_request = urllib.request.Request(
              status_url,
              headers={
                  "X-API-Key": API_KEY,
                  "Accept": "application/json",
              },
              method="GET",
          )

          with urllib.request.urlopen(
              status_request,
              timeout=30
          ) as response:
              status_data = json.loads(
                  response.read().decode("utf-8")
              )

          account = status_data.get("data", {})

          remaining = account.get("monthly_remaining")

          print(f"TwtAPI monthly remaining: {remaining}")

          if remaining is not None and int(remaining) <= 0:
              print("Monthly TwtAPI quota exhausted. Skipping this run.")
              raise SystemExit(0)

          # ------------------------------------------------------------
          # Search.
          # IMPORTANT: Search uses Bearer authentication.
          # ------------------------------------------------------------

          api_url = "https://api.twtapi.com/api/v1/twitter/Search"

          params = urllib.parse.urlencode({
              "q": query,
              "type": "Latest",
              "count": "20",
          })

          search_request = urllib.request.Request(
              f"{api_url}?{params}",
              headers={
                  "Authorization": f"Bearer {API_KEY}",
                  "Accept": "application/json",
              },
              method="GET",
          )

          print("Searching X...")

          try:
              with urllib.request.urlopen(
                  search_request,
                  timeout=60
              ) as response:
                  payload = json.loads(
                      response.read().decode("utf-8")
                  )
          except urllib.error.HTTPError as error:
              body = error.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(f"TwtAPI HTTP {error.code}")
              print(body)

              # Do not kill the whole scheduled system over one
              # temporary API failure.
              if error.code in (401, 403, 429, 500, 502, 503):
                  raise SystemExit(0)

              raise

          normalized = payload.get("_normalized", {})
          tweets = normalized.get("tweets", [])

          print(f"Received {len(tweets)} tweets.")

          # ------------------------------------------------------------
          # State format:
          # {
          #   "pair": [...],
          #   "xikers": [...],
          #   "seeun_fromm": [...],
          #   "yujun_fromm": [...]
          # }
          # ------------------------------------------------------------

          if not STATE_FILE.exists():
              state = {
                  "pair": [],
                  "xikers": [],
                  "seeun_fromm": [],
                  "yujun_fromm": [],
              }
          else:
              try:
                  state = json.loads(
                      STATE_FILE.read_text(
                          encoding="utf-8"
                      )
                  )

                  if not isinstance(state, dict):
                      raise ValueError("Invalid state format.")

              except Exception:
                  state = {
                      "pair": [],
                      "xikers": [],
                      "seeun_fromm": [],
                      "yujun_fromm": [],
                  }

          seen = set(state.get(category, []))

          # ------------------------------------------------------------
          # Extract tweet data from TwtAPI normalized response.
          # Handles normal tweets and TweetWithVisibilityResults.
          # ------------------------------------------------------------

          def extract_tweet(item):
              tweet_id = str(item.get("rest_id", ""))

              result = item.get("result") or {}

              if result.get("tweet"):
                  result = result.get("tweet") or {}

              legacy = result.get("legacy") or {}

              text = (
                  legacy.get("full_text")
                  or legacy.get("text")
                  or ""
              )

              user_result = (
                  result
                  .get("core", {})
                  .get("user_results", {})
                  .get("result", {})
              ) or {}

              user_core = user_result.get("core") or {}

              author = user_core.get(
                  "screen_name",
                  ""
              )

              created_at = legacy.get(
                  "created_at",
                  ""
              )

              if not tweet_id or not text:
                  return None

              return {
                  "id": tweet_id,
                  "text": text,
                  "author": author,
                  "created_at": created_at,
                  "url": (
                      f"https://x.com/{author}/status/{tweet_id}"
                  ),
              }

          # ------------------------------------------------------------
          # Filters.
          # ------------------------------------------------------------

          blocked_words = [
              "wts",
              "wtb",
              "sell",
              "selling",
              "buy",
              "photocard",
              "photo card",
              "photo-card",
              "pob",
              "pcs",
              "포카",
              "포토카드",
              "포토 카드",
              "양도",
              "거래",
              "교환",
              "판매",
          ]

          def is_trade(text):
              normalized = text.lower()

              for word in blocked_words:
                  if word in normalized:
                      return True, f"blocked:{word}"

              return False, ""

          def category_matches(text):
              normalized = text.lower()

              if category == "pair":
                  has_seeun = (
                      "seeun" in normalized
                      or "세은" in normalized
                      or "сэын" in normalized
                  )

                  has_yujun = (
                      "yujun" in normalized
                      or "유준" in normalized
                      or "юджун" in normalized
                  )

                  has_pair_name = (
                      "seejun" in normalized
                      or "сэджуны" in normalized
                  )

                  return (
                      (has_seeun and has_yujun)
                      or has_pair_name
                  )

              if category == "xikers":
                  # The search query already requires event-related
                  # context, so here we only confirm group presence.
                  return (
                      "xikers" in normalized
                      or "싸이커스" in normalized
                  )

              if category == "seeun_fromm":
                  return (
                      (
                          "seeun" in normalized
                          or "세은" in normalized
                          or "сэын" in normalized
                      )
                      and
                      (
                          "fromm" in normalized
                          or "프롬" in normalized
                      )
                  )

              if category == "yujun_fromm":
                  return (
                      (
                          "yujun" in normalized
                          or "유준" in normalized
                          or "юджун" in normalized
                      )
                      and
                      (
                          "fromm" in normalized
                          or "프롬" in normalized
                      )
                  )

              return False

          new_tweets = []

          for item in tweets:
              tweet = extract_tweet(item)

              if tweet is None:
                  continue

              if tweet["id"] in seen:
                  continue

              new_tweets.append(tweet)

          print(f"New unseen tweets: {len(new_tweets)}")

          # API returns newest first.
          # Send oldest first when there are several.
          new_tweets.reverse()

          updated_seen = set(seen)

          for tweet in new_tweets:
              updated_seen.add(tweet["id"])

              trade, reason = is_trade(
                  tweet["text"]
              )

              if trade:
                  print(
                      f"REJECT {tweet['id']}: {reason}"
                  )
                  continue

              if not category_matches(
                  tweet["text"]
              ):
                  print(
                      f"REJECT {tweet['id']}: "
                      "category filter"
                  )
                  continue

              if category == "pair":
                  label = "💞 Seeun × Yujun"
              elif category == "xikers":
                  label = "📰 Xikers"
              elif category == "seeun_fromm":
                  label = "💬 Seeun / Fromm"
              else:
                  label = "💬 Yujun / Fromm"

              message = (
                  f"{label}\n\n"
                  f"{tweet['text'][:3500]}\n\n"
                  f"{tweet['url']}"
              )

              telegram_url = (
                  f"https://api.telegram.org/bot"
                  f"{TELEGRAM_TOKEN}/sendMessage"
              )

              telegram_data = urllib.parse.urlencode({
                  "chat_id": CHAT_ID,
                  "text": message,
              }).encode("utf-8")

              telegram_request = urllib.request.Request(
                  telegram_url,
                  data=telegram_data,
                  method="POST",
              )

              with urllib.request.urlopen(
                  telegram_request,
                  timeout=30
              ) as response:
                  response.read()

              print(
                  f"SENT {tweet['id']} "
                  f"from @{tweet['author']}"
              )

          # Keep the state for this category bounded.
          state[category] = list(
              updated_seen
          )[-1000:]

          STATE_FILE.write_text(
              json.dumps(
                  state,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          PY

      - name: Save state
        run: |
          git config user.name "xikers-updates-bot"
          git config user.email "actions@users.noreply.github.com"

          git add x_search_seen.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update X search state"
          git push
