name: Test Talkwalker

on:
  workflow_dispatch:

jobs:
  test-talkwalker:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Talkwalker RSS
        env:
          TW_SEEUN_YUJUN_RSS: ${{ secrets.TW_SEEUN_YUJUN_RSS }}
          TW_YUJUN_SEEUN_RSS: ${{ secrets.TW_YUJUN_SEEUN_RSS }}
        run: |
          set -euo pipefail

          curl -fsSL \
            --retry 3 \
            --retry-delay 3 \
            "$TW_SEEUN_YUJUN_RSS" \
            -o seeun_yujun.xml

          curl -fsSL \
            --retry 3 \
            --retry-delay 3 \
            "$TW_YUJUN_SEEUN_RSS" \
            -o yujun_seeun.xml

          echo "Both Talkwalker RSS feeds downloaded."

          python - <<'PY'
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          feeds = [
              ("SEEUN YUJUN", "seeun_yujun.xml"),
              ("YUJUN SEEUN", "yujun_seeun.xml"),
          ]

          blocked_words = [
              "wts",
              "wtb",
              "sell",
              "selling",
              "photocard",
              "photo card",
              "포카",
              "양도",
              "거래",
              "교환",
          ]

          member_names = [
              "minjae",
              "junmin",
              "sumin",
              "jinsik",
              "hyunwoo",
              "seeun",
              "yujun",
              "hunter",
              "yechan",
              "junghoon",
          ]

          def get_tweet_text(link):
              match = re.search(r"/status/(\d+)", link)

              if not match:
                  return None

              tweet_id = match.group(1)

              url = (
                  "https://cdn.syndication.twimg.com/tweet-result"
                  f"?id={tweet_id}&lang=en&token=0"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json",
                  },
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:
                      data = json.loads(
                          response.read().decode("utf-8")
                      )
              except Exception as e:
                  print("Syndication request failed:", e)
                  return None

              return data.get("text", "")


          seen_ids = set()

          for feed_name, filename in feeds:
              print("\n" + "=" * 70)
              print(feed_name)
              print("=" * 70)

              root = ET.parse(filename).getroot()
              items = root.findall(".//item")

              print(f"Found {len(items)} items.")

              for index, item in enumerate(items[:10], start=1):
                  link = item.findtext("link", "").strip()
                  pub_date = item.findtext("pubDate", "").strip()

                  match = re.search(r"/status/(\d+)", link)

                  if not match:
                      print("\nSKIP: no tweet ID")
                      continue

                  tweet_id = match.group(1)

                  if tweet_id in seen_ids:
                      print(f"\nDUPLICATE: {tweet_id}")
                      continue

                  seen_ids.add(tweet_id)

                  text = get_tweet_text(link)

                  if not text:
                      print(f"\nUNKNOWN: {tweet_id}")
                      continue

                  normalized = text.lower()

                  reasons = []

                  for word in blocked_words:
                      if word in normalized:
                          reasons.append(f"blocked:{word}")

                  member_count = sum(
                      1
                      for name in member_names
                      if re.search(
                          rf"\b{re.escape(name)}\b",
                          normalized
                      )
                  )

                  print("\n----------------------------------------")
                  print("Date:", pub_date)
                  print("Author:", tweet_id)
                  print("Text:")
                  print(text)

                  if reasons:
                      print("RESULT: REJECT")
                      print("WHY:", ", ".join(reasons))
                  else:
                      print("RESULT: KEEP")
          PY
