name: Test Talkwalker

on:
  workflow_dispatch:

jobs:
  test-talkwalker:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Talkwalker RSS
        env:
          TW_SEEUN_YUJUN_RSS: ${{ secrets.TW_SEEUN_YUJUN_RSS }}
          TW_YUJUN_SEEUN_RSS: ${{ secrets.TW_YUJUN_SEEUN_RSS }}
        run: |
          set -euo pipefail

          curl -fsSL \
            --retry 3 \
            --retry-delay 3 \
            "$TW_SEEUN_YUJUN_RSS" \
            -o seeun_yujun.xml

          curl -fsSL \
            --retry 3 \
            --retry-delay 3 \
            "$TW_YUJUN_SEEUN_RSS" \
            -o yujun_seeun.xml

          echo "Both Talkwalker RSS feeds downloaded."

          python - <<'PY'
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          feeds = [
              ("SEEUN YUJUN", "seeun_yujun.xml"),
              ("YUJUN SEEUN", "yujun_seeun.xml"),
          ]

          for feed_name, filename in feeds:
              print("\n" + "=" * 60)
              print(feed_name)
              print("=" * 60)

              root = ET.parse(filename).getroot()
              items = root.findall(".//item")

              print(f"Found {len(items)} items.")

              for index, item in enumerate(items[:5], start=1):
                  link = item.findtext("link", "").strip()
                  pub_date = item.findtext("pubDate", "").strip()

                  print("\n---")
                  print(f"Result #{index}")
                  print("Talkwalker date:", pub_date)
                  print("Talkwalker link:", link)

                  match = re.search(r"/status/(\d+)", link)

                  if not match:
                      print("Could not find tweet ID.")
                      continue

                  tweet_id = match.group(1)

                  syndication_url = (
                      "https://cdn.syndication.twimg.com/tweet-result"
                      f"?id={tweet_id}&lang=en&token=0"
                  )

                  request = urllib.request.Request(
                      syndication_url,
                      headers={
                          "User-Agent": "Mozilla/5.0",
                          "Accept": "application/json",
                      },
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=30
                      ) as response:
                          data = json.loads(
                              response.read().decode("utf-8")
                          )
                  except Exception as e:
                      print("Syndication request failed:", e)
                      continue

                  user = data.get("user") or {}

                  print("Author:", user.get("screen_name", ""))
                  print("Created:", data.get("created_at", ""))
                  print("Text:")
                  print(data.get("text", ""))

                  print(
                      "Media:",
                      "yes" if data.get("mediaDetails") else "no"
                  )
          PY
