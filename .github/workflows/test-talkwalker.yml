name: Test Talkwalker

on:
  workflow_dispatch:

jobs:
  test-talkwalker:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Talkwalker RSS
        env:
          TW_RSS_URL: ${{ secrets.TW_SEEUN_YUJUN_RSS }}
        run: |
          set -euo pipefail

          curl -fsSL \
            --retry 3 \
            --retry-delay 3 \
            "$TW_RSS_URL" \
            -o talkwalker.xml

          echo "Talkwalker RSS downloaded."

          python - <<'PY'
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          root = ET.parse("talkwalker.xml").getroot()
          items = root.findall(".//item")

          if not items:
              print("No RSS items found.")
              raise SystemExit(0)

          print(f"Found {len(items)} items.")

          for index, item in enumerate(items[:5], start=1):
              link = item.findtext("link", "").strip()
              pub_date = item.findtext("pubDate", "").strip()

              print("\n====================")
              print(f"RESULT #{index}")
              print("Talkwalker date:", pub_date)
              print("Talkwalker link:", link)

              match = re.search(r"/status/(\d+)", link)

              if not match:
                  print("Could not find tweet ID.")
                  continue

              tweet_id = match.group(1)

              syndication_url = (
                  "https://cdn.syndication.twimg.com/tweet-result"
                  f"?id={tweet_id}&lang=en&token=0"
              )

              request = urllib.request.Request(
                  syndication_url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json",
                  },
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:
                      data = json.loads(
                          response.read().decode("utf-8")
                      )
              except Exception as e:
                  print("Syndication request failed:", e)
                  continue

              user = data.get("user") or {}

              print("Tweet ID:", tweet_id)
              print("Author:", user.get("screen_name", ""))
              print("Created:", data.get("created_at", ""))
              print("Text:")
              print(data.get("text", ""))

              if data.get("mediaDetails"):
                  print("Media: yes")
              else:
                  print("Media: no")
          PY
