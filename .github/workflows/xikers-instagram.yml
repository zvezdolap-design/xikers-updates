name: xikers Instagram

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xikers-instagram
  cancel-in-progress: false

jobs:
  check-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Check Instagram via Apify
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from urllib.error import HTTPError, URLError

          APIFY_TOKEN = os.environ["APIFY_API_TOKEN"]
          TELEGRAM_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          APIFY_URL = (
              "https://api.apify.com/v2/actors/"
              "datascraperes~instagram-public-posts-scraper/"
              "run-sync-get-dataset-items"
              "?format=json"
          )

          payload = {
              "profiles": ["xikers_official"],
              "resultsLimit": 1,
              "maxPostsPerProfile": 1,
              "includeReels": True
          }

          print("Starting Apify...")

          request = urllib.request.Request(
              APIFY_URL,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {APIFY_TOKEN}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=280) as response:
                  raw = response.read().decode("utf-8")
          except HTTPError as e:
              body = e.read().decode("utf-8", errors="replace")
              print(f"Apify HTTP {e.code}")
              print(body)
              raise SystemExit(1)
          except URLError as e:
              print(f"Apify connection error: {e}")
              raise SystemExit(1)

          data = json.loads(raw)

          if isinstance(data, dict) and "items" in data:
              items = data["items"]
          elif isinstance(data, list):
              items = data
          else:
              print("Unexpected Apify response:")
              print(json.dumps(data, ensure_ascii=False, indent=2))
              raise SystemExit(1)

          post = None

          for item in items:
              if not isinstance(item, dict):
                  continue

              if (
                  item.get("shortCode")
                  and item.get("url")
                  and item.get("timestamp")
              ):
                  post = item
                  break

          if post is None:
              print("Instagram: no post returned by Apify.")
              print(json.dumps(items, ensure_ascii=False, indent=2))
              raise SystemExit(0)

          post_id = str(post.get("shortCode"))
          post_url = post.get("url", "")
          caption = post.get("caption") or ""
          published = post.get("timestamp") or ""

          print(f"Instagram post: {post_id}")
          print(f"Published: {published}")
          print(f"URL: {post_url}")

          state_file = Path("last_instagram_apify.txt")

          if not state_file.exists():
              state_file.write_text(post_id, encoding="utf-8")
              print(f"Instagram: initialized with {post_id}")
              raise SystemExit(0)

          last_id = state_file.read_text(encoding="utf-8").strip()

          if post_id == last_id:
              print("Instagram: no new post.")
              raise SystemExit(0)

          message = "📸 xikers / Instagram\n\n"

          if caption:
              message += caption[:3500].rstrip() + "\n\n"

          message += post_url

          telegram_url = (
              f"https://api.telegram.org/bot{TELEGRAM_TOKEN}/sendMessage"
          )

          telegram_data = urllib.parse.urlencode({
              "chat_id": CHAT_ID,
              "text": message,
          }).encode("utf-8")

          telegram_request = urllib.request.Request(
              telegram_url,
              data=telegram_data,
              method="POST",
          )

          try:
              with urllib.request.urlopen(
                  telegram_request,
                  timeout=30
              ) as response:
                  result = response.read().decode("utf-8")
          except HTTPError as e:
              body = e.read().decode("utf-8", errors="replace")
              print(f"Telegram HTTP {e.code}")
              print(body)
              raise SystemExit(1)

          print("Telegram response:")
          print(result)

          state_file.write_text(post_id, encoding="utf-8")

          print(f"Instagram: sent {post_id}")
          PY

      - name: Save Instagram state
        run: |
          git config user.name "xikers-updates-bot"
          git config user.email "actions@users.noreply.github.com"

          git add last_instagram_apify.txt

          if git diff --cached --quiet; then
            echo "No Instagram state changes."
            exit 0
          fi

          git commit -m "Update Instagram state"
          git push
